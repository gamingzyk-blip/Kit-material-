<title>Kit de material</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17212b;--mute:#66727f;--line:#d5dbe1;--neg:#c62828;--negbg:#fdeaea;--pos:#17795e;--acc:#1f4e79;--acct:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#19222b;--ink:#e8edf2;--mute:#8c99a6;--line:#2c3844;--neg:#ff6b6b;--negbg:#3a1d1f;--pos:#4cc9a0;--acc:#6aa9e0;--acct:#0b1218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161c;--card:#19222b;--ink:#e8edf2;--mute:#8c99a6;--line:#2c3844;--neg:#ff6b6b;--negbg:#3a1d1f;--pos:#4cc9a0;--acc:#6aa9e0;--acct:#0b1218;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px;background:var(--line);padding:4px;border-radius:12px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px 4px;border-radius:9px;cursor:pointer}
nav button.on{background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.neg{border-color:var(--neg);background:var(--negbg)}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.name{font-weight:700;font-size:18px}
.sub{color:var(--mute);font-size:14px}
.saldo{font-size:34px;font-weight:800;line-height:1;color:var(--pos)}
.saldo.neg{color:var(--neg)}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.q{width:76px}.f{flex:1}
.btn{border:0;background:var(--acc);color:var(--acct);font:inherit;font-weight:700;padding:10px 14px;border-radius:9px;cursor:pointer}
.btn.sec{background:none;color:var(--mute);border:1px solid var(--line)}
.btn.danger{background:var(--neg);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.use{margin-top:12px}
.obs{margin-top:10px}
.obs label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;min-height:76px;resize:vertical}
textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
details summary{cursor:pointer;font-weight:700}
details .row{margin-top:10px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
<h1>Kit de material</h1>
<nav id="tabs">
<button data-t="kit" class="on">Kit</button>
<button data-t="repor">Repor</button>
</nav>
<div id="view"></div>
</main>
<script>
var KEY="kit-v2",S={items:[]},tab="kit",armed=null;
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
S.items.forEach(function(it){if(!it.uses){it.uses=[];for(var i=0;i<(it.used||0);i++)it.uses.push(i===0?(it.obs||""):"")}delete it.used;delete it.obs});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function find(id){return S.items.find(function(i){return i.id===id})}
function nu(it){return it.uses.length}
function sal(it){return nu(it)>0?'−'+nu(it):'OK'}

function render(){
  var b=document.querySelectorAll("#tabs button");
  for(var i=0;i<b.length;i++)b[i].className=b[i].dataset.t===tab?"on":"";
  document.getElementById("view").innerHTML=tab==="kit"?vKit():vRepor();
}

function vKit(){
  var h='<details class="card"><summary>Novo item no kit</summary><div class="row">'+
    '<input class="f" id="nn" placeholder="Nome do item"><input class="q" id="nq" type="number" inputmode="numeric" min="1" placeholder="Padrão">'+
    '<button class="btn" onclick="addItem()">Adicionar</button></div></details>';
  if(!S.items.length)return h+'<div class="empty">Kit vazio. Adicione os itens e a quantidade padrão de cada um.</div>';
  S.items.forEach(function(it){
    var k=nu(it),n=k>0;
    h+='<div class="card'+(n?' neg':'')+'"><div class="row sp"><div><div class="name">'+esc(it.name)+'</div>'+
      '<div class="sub">Restam '+(it.std-k)+' de '+it.std+'</div></div><div class="saldo'+(n?' neg':'')+'">'+sal(it)+'</div></div>'+
      '<div class="row use"><button class="btn" onclick="mv(\''+it.id+'\',1)">Usei 1</button>'+
      '<button class="btn sec" onclick="mv(\''+it.id+'\',-1)"'+(n?'':' disabled')+'>Desfazer</button></div>';
    it.uses.forEach(function(o,i){
      h+='<div class="obs"><label>Uso '+(i+1)+' · onde foi usado?</label>'+
        '<textarea id="o-'+it.id+'-'+i+'" rows="3" placeholder="Ex.: local, cliente, equipamento..." oninput="obs(\''+it.id+'\','+i+',this.value)">'+esc(o)+'</textarea></div>';
    });
    h+='</div>';
  });
  return h;
}

function vRepor(){
  if(!S.items.length)return '<div class="empty">Adicione itens na aba Kit primeiro.</div>';
  var falta=S.items.some(function(i){return nu(i)>0});
  var h='<button class="btn" style="width:100%;margin-bottom:12px"'+(falta?'':' disabled')+' onclick="reporTudo()">Repor kit inteiro</button>';
  S.items.forEach(function(it){
    var n=nu(it)>0,ob=it.uses.filter(Boolean).map(esc).join(" · ");
    h+='<div class="card"><div class="row sp"><div><div class="name">'+esc(it.name)+'</div>'+
      '<div class="sub">'+(n?(ob||"Sem observação"):"Completo")+'</div></div><div class="saldo'+(n?' neg':'')+'">'+sal(it)+'</div></div>'+
      '<div class="row use"><button class="btn f"'+(n?'':' disabled')+' onclick="repor(\''+it.id+'\')">Repor</button>'+
      '<input class="q" type="number" inputmode="numeric" min="1" value="'+it.std+'" title="Quantidade padrão" onchange="setStd(\''+it.id+'\',this.value)">'+
      '<button class="btn '+(armed===it.id?'danger':'sec')+'" onclick="del(\''+it.id+'\')">'+(armed===it.id?'Confirmar':'Excluir')+'</button></div></div>';
  });
  return h+'<p class="sub">O campo numérico é a quantidade padrão do item no kit.</p>';
}

function addItem(){
  var n=document.getElementById("nn").value.trim(),q=parseInt(document.getElementById("nq").value,10);
  if(!n||!q||q<1)return;
  S.items.push({id:uid(),name:n,std:q,uses:[]});save();render();
}
function mv(id,d){
  var it=find(id);if(!it)return;
  if(d>0)it.uses.push("");else it.uses.pop();
  save();render();
  if(d>0){var el=document.getElementById("o-"+id+"-"+(it.uses.length-1));if(el)el.focus()}
}
function obs(id,i,v){var it=find(id);if(it){it.uses[i]=v;save()}}
function repor(id){var it=find(id);if(!it)return;it.uses=[];save();render()}
function reporTudo(){S.items.forEach(function(i){i.uses=[]});save();render()}
function setStd(id,v){var it=find(id),q=parseInt(v,10);if(!it||!q||q<1)return;it.std=q;save();render()}
function del(id){
  if(armed!==id){armed=id;render();return}
  S.items=S.items.filter(function(i){return i.id!==id});armed=null;save();render();
}
document.getElementById("tabs").addEventListener("click",function(e){
  var t=e.target.dataset&&e.target.dataset.t;if(t){tab=t;armed=null;render()}
});
render();
</script>
</body>
</html>
