<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0AgMAAABAo+6hAAAADFBMVEUfTnn////W4u4AAACY5sS7AAABS0lEQVR42u2VTWrDMBCFR5MWSk5i0ut00WWP5o1LS7LQEXyfat2Noe6iprGkNyN1V8J7YAji44s0ox8RhmEYhrnpPODhAx5+fZzRsEL4KMMf3JMEKIfu0/ZVCcjwJiLy+dLnHra5d7l/1FCulhrKg6lG8rqC77+/7qsqat2Yek62e9pPs5Sro67lB0ddy9VTV/Kc1rEswujQg4i7joAbc03WIvXVhTw01LlcG+pcvnMfR3yiv55Rdybjtti1SM3GoBle6cWkE1plNOB1RvQyY/qCK5ggvBi9XKE8Wp1PDXVOI3m0d2zy1QW9llUsBtRTVX+m3jSrhag7z9S6q6JXI/WKkNo38sXZOOpsudhz2yd7w6u9n2PfK5XMs6TmYYm9r+vH9nW+89E4GWqcLnzq7iAczxKeut1WSJMmTZo0adKkSd8azTAMwzD/N98Of09vQs4avwAAAABJRU5ErkJggg==">
<title>Kit de material</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17212b;--mute:#66727f;--line:#d5dbe1;--neg:#c62828;--negbg:#fdeaea;--pos:#17795e;--acc:#1f4e79;--acct:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#19222b;--ink:#e8edf2;--mute:#8c99a6;--line:#2c3844;--neg:#ff6b6b;--negbg:#3a1d1f;--pos:#4cc9a0;--acc:#6aa9e0;--acct:#0b1218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161c;--card:#19222b;--ink:#e8edf2;--mute:#8c99a6;--line:#2c3844;--neg:#ff6b6b;--negbg:#3a1d1f;--pos:#4cc9a0;--acc:#6aa9e0;--acct:#0b1218;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:4px 0 14px}
.alert{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;padding:0;opacity:.55}
.alert small{font-size:11px;line-height:1.1;font-weight:600}
.alert .ic{position:relative;width:40px;height:40px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center}
.alert .ic b{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--neg);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;padding:0 5px}
.alert.on{opacity:1;color:var(--neg)}
.alert.on .ic{background:var(--negbg);box-shadow:0 0 0 4px var(--negbg),0 0 14px var(--neg)}
.alert.on .ic b{display:flex}
nav{display:flex;gap:6px;margin-bottom:14px;background:var(--line);padding:4px;border-radius:12px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px 4px;border-radius:9px;cursor:pointer}
nav button.on{background:var(--card);color:var(--ink)}
nav .sbtn{flex:0 0 48px;display:flex;align-items:center;justify-content:center}
#sbar{display:none;margin-bottom:14px}
#sbar.open{display:block}
#sbar input{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.neg{border-color:var(--neg);background:var(--negbg)}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.name{font-weight:700;font-size:18px}
.sub{color:var(--mute);font-size:14px}
.saldo{font-size:34px;font-weight:800;line-height:1;color:var(--pos)}
.saldo.neg{color:var(--neg)}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.q{width:76px}.f{flex:1}
.btn{border:0;background:var(--acc);color:var(--acct);font:inherit;font-weight:700;padding:10px 14px;border-radius:9px;cursor:pointer}
.btn.sec{background:none;color:var(--mute);border:1px solid var(--line)}
.btn.danger{background:var(--neg);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.use{margin-top:12px}
.obs{margin-top:10px}
.obs label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;min-height:76px;resize:vertical}
textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.ln{margin-top:6px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
details summary{cursor:pointer;font-weight:700}
details .row{margin-top:10px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
<div class="top">
<h1>Kit de material</h1>
<button class="alert" id="alert" onclick="go('repor')" aria-label="Itens a repor"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg><b id="cnt">0</b></span><small>Itens a repor</small></button>
</div>
<nav id="tabs">
<button data-t="kit" class="on">Kit</button>
<button data-t="repor">Repor</button>
<button data-t="rel">Relatório</button>
<button class="sbtn" id="sbtn" onclick="toggleBusca()" aria-label="Buscar equipamento"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg></button>
</nav>
<div id="sbar"><input id="sq" type="search" placeholder="Buscar equipamento..." oninput="setQ(this.value)" autocomplete="off"></div>
<div id="view"></div>
</main>
<script>
var KEY="kit-v2",S={items:[]},tab="kit",armed=null,q="",aberta=false;
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
S.items.forEach(function(it){if(!it.uses){it.uses=[];for(var i=0;i<(it.used||0);i++)it.uses.push(i===0?(it.obs||""):"")}delete it.used;delete it.obs});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function find(id){return S.items.find(function(i){return i.id===id})}
function nu(it){return it.uses.length}
function sal(it){return nu(it)>0?'−'+nu(it):'OK'}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function ord(){return S.items.slice().sort(function(a,b){return a.name.localeCompare(b.name,"pt",{sensitivity:"base"})})}
function lista(){
  var k=norm(q.trim());
  return ord().filter(function(i){return !k||norm(i.name).indexOf(k)>-1});
}

function render(){
  var b=document.querySelectorAll("#tabs button[data-t]");
  for(var i=0;i<b.length;i++)b[i].className=b[i].dataset.t===tab?"on":"";
  var c=S.items.filter(function(i){return nu(i)>0}).length;
  document.getElementById("alert").className="alert"+(c?" on":"");
  document.getElementById("cnt").textContent=c;
  document.getElementById("view").innerHTML=tab==="kit"?vKit():tab==="repor"?vRepor():vRel();
}

function vKit(){
  var h='<details class="card"><summary>Novo item no kit</summary><div class="row">'+
    '<input class="f" id="nn" placeholder="Nome do item"><input class="q" id="nq" type="number" inputmode="numeric" min="1" placeholder="Padrão">'+
    '<button class="btn" onclick="addItem()">Adicionar</button></div></details>';
  if(!S.items.length)return h+'<div class="empty">Kit vazio. Adicione os itens e a quantidade padrão de cada um.</div>';
  var L=lista();
  if(!L.length)return h+'<div class="empty">Nenhum item encontrado.</div>';
  L.forEach(function(it){
    var k=nu(it),n=k>0;
    h+='<div class="card'+(n?' neg':'')+'"><div class="row sp"><div><div class="name">'+esc(it.name)+'</div>'+
      '<div class="sub">Restam '+(it.std-k)+' de '+it.std+'</div></div><div class="saldo'+(n?' neg':'')+'">'+sal(it)+'</div></div>'+
      '<div class="row use"><button class="btn" onclick="mv(\''+it.id+'\',1)">Usei 1</button>'+
      '<button class="btn sec" onclick="mv(\''+it.id+'\',-1)"'+(n?'':' disabled')+'>Desfazer</button></div>';
    it.uses.forEach(function(o,i){
      h+='<div class="obs"><label>Uso '+(i+1)+' · onde foi usado?</label>'+
        '<textarea id="o-'+it.id+'-'+i+'" rows="3" placeholder="Ex.: local, cliente, equipamento..." oninput="obs(\''+it.id+'\','+i+',this.value)">'+esc(o)+'</textarea></div>';
    });
    h+='</div>';
  });
  return h;
}

function vRepor(){
  if(!S.items.length)return '<div class="empty">Adicione itens na aba Kit primeiro.</div>';
  var falta=S.items.some(function(i){return nu(i)>0});
  var h='<button class="btn" style="width:100%;margin-bottom:12px"'+(falta?'':' disabled')+' onclick="reporTudo()">Repor kit inteiro</button>';
  var L=lista();
  if(!L.length)return h+'<div class="empty">Nenhum item encontrado.</div>';
  L.forEach(function(it){
    var n=nu(it)>0,ob=it.uses.filter(Boolean).map(esc).join(" · ");
    h+='<div class="card"><div class="row sp"><div><div class="name">'+esc(it.name)+'</div>'+
      '<div class="sub">'+(n?(ob||"Sem observação"):"Completo")+'</div></div><div class="saldo'+(n?' neg':'')+'">'+sal(it)+'</div></div>'+
      '<div class="row use"><button class="btn f"'+(n?'':' disabled')+' onclick="repor(\''+it.id+'\')">Repor</button>'+
      '<input class="q" type="number" inputmode="numeric" min="1" value="'+it.std+'" title="Quantidade padrão" onchange="setStd(\''+it.id+'\',this.value)">'+
      '<button class="btn '+(armed===it.id?'danger':'sec')+'" onclick="del(\''+it.id+'\')">'+(armed===it.id?'Confirmar':'Excluir')+'</button></div></div>';
  });
  return h+'<p class="sub">O campo numérico é a quantidade padrão do item no kit.</p>';
}

function enc(s){
  s=String(s).normalize("NFC").replace(/[\u2212\u2013\u2014]/g,"-").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\u2026/g,"...").replace(/[\r\n\t]+/g," ");
  var r="";
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c===40||c===41||c===92)r+="\\"+s[i];
    else if(c>=32&&c<127)r+=s[i];
    else if(c>=160&&c<256)r+="\\"+("00"+c.toString(8)).slice(-3);
    else r+="?";
  }
  return r;
}
function cw(c){
  if("il.,;:'|!jI ".indexOf(c)>-1)return .28;
  if("fr()-t[]\"".indexOf(c)>-1)return .36;
  if("mwMW@%".indexOf(c)>-1)return .85;
  if(c>="A"&&c<="Z")return .68;
  return .53;
}
function tw(s,sz,b){var w=0;for(var i=0;i<s.length;i++)w+=cw(s[i]);return w*sz*(b?1.07:1)}
function quebra(txt,sz,b,max){
  var out=[],cur="";
  String(txt).replace(/[\r\n\t]+/g," ").split(" ").forEach(function(w){
    if(!w)return;
    while(tw(w,sz,b)>max){
      var k=1;while(k<w.length&&tw(w.slice(0,k+1),sz,b)<=max)k++;
      if(cur){out.push(cur);cur=""}
      out.push(w.slice(0,k));w=w.slice(k);
    }
    var t=cur?cur+" "+w:w;
    if(tw(t,sz,b)<=max)cur=t;else{out.push(cur);cur=w}
  });
  if(cur||!out.length)out.push(cur);
  return out;
}
function pdfBytes(pages){
  var o=[],n=pages.length,kids=[],i;
  for(i=0;i<n;i++)kids.push((5+2*i)+" 0 R");
  o[1]="<< /Type /Catalog /Pages 2 0 R >>";
  o[2]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>";
  o[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  o[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  for(i=0;i<n;i++){
    o[5+2*i]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(6+2*i)+" 0 R >>";
    o[6+2*i]="<< /Length "+pages[i].length+" >>\nstream\n"+pages[i]+"\nendstream";
  }
  var s="%PDF-1.4\n",off=[];
  for(i=1;i<o.length;i++){off[i]=s.length;s+=i+" 0 obj\n"+o[i]+"\nendobj\n"}
  var x=s.length;
  s+="xref\n0 "+o.length+"\n0000000000 65535 f \n";
  for(i=1;i<o.length;i++)s+=("0000000000"+off[i]).slice(-10)+" 00000 n \n";
  s+="trailer\n<< /Size "+o.length+" /Root 1 0 R >>\nstartxref\n"+x+"\n%%EOF";
  var u=new Uint8Array(s.length);
  for(i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;
  return u;
}
function montarPDF(U,titulo){
  var pages=[],cur="",y=790,L=50,W=495;
  function nova(){pages.push(cur);cur="";y=790}
  function lin(txt,b,sz,x,extra){
    if(y<70)nova();
    cur+="BT /F"+(b?2:1)+" "+sz+" Tf "+x+" "+y.toFixed(1)+" Td ("+enc(txt)+") Tj ET\n";
    y-=sz*1.35+(extra||0);
  }
  function par(txt,b,sz,x,extra){
    var ls=quebra(txt,sz,b,W-(x-L));
    ls.forEach(function(l,i){lin(l,b,sz,x,i===ls.length-1?extra:0)});
  }
  var tot=U.reduce(function(a,i){return a+nu(i)},0);
  par("Materiais usados",true,20,L,4);
  if(titulo&&titulo.trim())par(titulo.trim(),true,13,L,2);
  par("Gerado em "+new Date().toLocaleString("pt-BR")+"  |  "+U.length+" item(ns), "+tot+" uso(s)",false,10,L,14);
  U.forEach(function(it){
    if(y<130)nova();
    par(it.name+"  (-"+nu(it)+" de "+it.std+")",true,13,L,3);
    it.uses.forEach(function(o,i){par((i+1)+". "+(String(o).trim()||"(sem observação)"),false,11,L+14,2)});
    y-=10;
  });
  pages.push(cur);
  var n=pages.length;
  pages=pages.map(function(p,i){return p+"BT /F1 9 Tf "+L+" 30 Td ("+enc("Página "+(i+1)+" de "+n)+") Tj ET\n"});
  return pdfBytes(pages);
}

function usados(){return ord().filter(function(i){return nu(i)>0})}
function vRel(){
  var U=usados(),tot=U.reduce(function(a,i){return a+nu(i)},0);
  var h='<div class="card"><label class="sub" for="rt">Título do relatório (opcional)</label>'+
    '<input id="rt" style="width:100%;margin-top:6px" placeholder="Ex.: obra, cliente ou data" value="'+esc(S.titulo||"")+'" oninput="S.titulo=this.value;save()">'+
    '<button class="btn" style="width:100%;margin-top:12px"'+(U.length?'':' disabled')+' onclick="gerarPDF()">Gerar PDF</button></div>';
  if(!U.length)return h+'<div class="empty">Nenhum material usado no momento.</div>';
  h+='<p class="sub">'+U.length+' item(ns) · '+tot+' uso(s) no relatório</p>';
  U.forEach(function(it){
    h+='<div class="card neg"><div class="row sp"><div class="name">'+esc(it.name)+'</div><div class="saldo neg">'+sal(it)+'</div></div>';
    it.uses.forEach(function(o,i){h+='<div class="ln">'+(i+1)+'. '+(String(o).trim()?esc(o):'<span class="sub">(sem observação)</span>')+'</div>'});
    h+='</div>';
  });
  return h;
}
function gerarPDF(){
  var U=usados();if(!U.length)return;
  var bytes=montarPDF(U,S.titulo||"");
  var nome="materiais-usados-"+new Date().toISOString().slice(0,10)+".pdf";
  var blob=new Blob([bytes],{type:"application/pdf"});
  try{
    var f=new File([blob],nome,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Materiais usados"}).catch(function(){});return}
  }catch(e){}
  var u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},10000);
}

function addItem(){
  var n=document.getElementById("nn").value.trim(),q=parseInt(document.getElementById("nq").value,10);
  if(!n||!q||q<1)return;
  S.items.push({id:uid(),name:n,std:q,uses:[]});save();render();
}
function mv(id,d){
  var it=find(id);if(!it)return;
  if(d>0)it.uses.push("");else it.uses.pop();
  save();render();
  if(d>0){var el=document.getElementById("o-"+id+"-"+(it.uses.length-1));if(el)el.focus()}
}
function obs(id,i,v){var it=find(id);if(it){it.uses[i]=v;save()}}
function repor(id){var it=find(id);if(!it)return;it.uses=[];save();render()}
function reporTudo(){S.items.forEach(function(i){i.uses=[]});save();render()}
function setStd(id,v){var it=find(id),n=parseInt(v,10);if(!it||!n||n<1)return;it.std=n;save();render()}
function del(id){
  if(armed!==id){armed=id;render();return}
  S.items=S.items.filter(function(i){return i.id!==id});armed=null;save();render();
}
function go(t){tab=t;armed=null;render();window.scrollTo(0,0)}
function setQ(v){q=v;render()}
function toggleBusca(){
  aberta=!aberta;
  document.getElementById("sbar").className=aberta?"open":"";
  document.getElementById("sbtn").className="sbtn"+(aberta?" on":"");
  if(aberta){document.getElementById("sq").focus()}
  else{q="";document.getElementById("sq").value="";render()}
}
document.getElementById("tabs").addEventListener("click",function(e){
  var t=e.target.dataset&&e.target.dataset.t;if(t)go(t);
});
render();
</script>
</body>
</html>
